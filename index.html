<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myndapong</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07070f;
    --surface: #10101e;
    --border: #ffffff18;
    --text: #e8e8f0;
    --muted: #7070a0;
    --blue: #4f8ef7;
    --red: #f74f4f;
    --accent: #c8f050;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 2.5rem 1.25rem 3.5rem;
  }

  h1 {
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.9rem;
  }

  /* Mode selector */
  #mode-selector {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 1.5rem;
  }
  .mode-btn {
    padding: 12px 28px;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: #07070f;
  }
  .mode-btn:not(.active):hover { background: #ffffff10; color: var(--text); }

  /* Scoreboard */
  #scoreboard {
    display: flex;
    align-items: center;
    gap: 2rem;
    margin-bottom: 14px;
    font-size: 2.9rem;
    font-weight: 700;
  }
  #score-left { color: var(--blue); min-width: 60px; text-align: right; }
  #score-right { color: var(--red); min-width: 60px; text-align: left; }
  #scoreboard .sep { color: var(--muted); font-size: 1.7rem; }

  #friend-label {
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    min-height: 20px;
  }

  canvas {
    display: block;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #07070f;
    width: min(92vw, 760px);
    height: auto;
    max-width: 100%;
    touch-action: none;
  }

  #controls-hint {
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-top: 14px;
    text-align: center;
    min-height: 18px;
  }

  #msg {
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-top: 10px;
    min-height: 20px;
    text-transform: uppercase;
    text-align: center;
  }

  /* Photo info */
  #info-wrap {
    margin-top: 1.9rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem 1.5rem;
    background: var(--surface);
    width: 100%;
    max-width: 760px;
    text-align: center;
  }
  #info-wrap h2 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  #photo-info {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }
  #rotate-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: rgba(7, 7, 15, 0.94);
    z-index: 20;
  }
  body.rotate-lock #rotate-overlay {
    display: flex;
  }
  .rotate-card {
    width: min(92vw, 460px);
    border: 1px solid var(--border);
    border-radius: 18px;
    background: linear-gradient(180deg, #151527 0%, #0d0d19 100%);
    padding: 1.6rem 1.4rem;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }
  .rotate-card h2 {
    font-size: 1rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.9rem;
  }
  .rotate-card p {
    font-size: 0.98rem;
    line-height: 1.65;
    color: var(--text);
  }
  .rotate-card .muted {
    display: block;
    margin-top: 0.8rem;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>

<h1>Myndapong</h1>

<div id="mode-selector">
  <button class="mode-btn active" id="btn-1p" onclick="setMode(1)">1 leikmaður</button>
  <button class="mode-btn" id="btn-2p" onclick="setMode(2)">2 leikmenn</button>
</div>

<div id="scoreboard">
  <span id="score-left">0</span>
  <span class="sep">:</span>
  <span id="score-right">0</span>
</div>

<div id="friend-label">—</div>

<canvas id="pong" width="760" height="500"></canvas>

<div id="controls-hint"></div>
<div id="msg">Smelltu á völlinn til að byrja</div>

<div id="info-wrap">
  <h2>Myndir í leiknum</h2>
  <div id="photo-info"></div>
</div>

<div id="rotate-overlay" aria-live="polite">
  <div class="rotate-card">
    <h2>Snúðu símanum</h2>
    <p>Settu símann í lárétta stöðu til að spila. Þegar skjárinn er kominn á hlið geturðu dregið spaðann með fingrinum.</p>
    <span class="muted">Lárétt skjástaða nauðsynleg</span>
  </div>
</div>

<script>
const canvas = document.getElementById('pong');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const rotateOverlay = document.getElementById('rotate-overlay');

const PADDLE_W = 14, PADDLE_H = 96, BALL_R = 30;
const AI_SPEED = 4.6;
const IMAGE_FILE_PREFIX = 'mynd-';
const IMAGE_FILE_SUFFIX = '.jpg';
const MAX_IMAGE_SCAN = 200;
const MAX_CONSECUTIVE_MISSES = 3;
const DEFAULT_BALL_NAME = 'Mynd 1';
const TOUCH_DEVICE = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;

let mode = 1; // 1 or 2

let friends = [];
let friendImgs = [];
let ballIdx = 0;

let leftY = H/2 - PADDLE_H/2;
let rightY = H/2 - PADDLE_H/2;
let ballX = W/2, ballY = H/2;
let vx = 0, vy = 0;
let scoreL = 0, scoreR = 0;
let serving = true;
let started = false;
let portraitBlocked = false;
let imageScanComplete = false;

const pointerAssignments = new Map();

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.code === 'Space' && !portraitBlocked) startOrServe();
  e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('pointerdown', handlePointerDown);
canvas.addEventListener('pointermove', handlePointerMove);
canvas.addEventListener('pointerup', handlePointerEnd);
canvas.addEventListener('pointercancel', handlePointerEnd);
window.addEventListener('resize', updateOrientationGate);
window.addEventListener('orientationchange', updateOrientationGate);

function startOrServe() {
  if (!imageScanComplete) return;
  started = true;
  if (serving) serve();
  updateUI();
}

function getStartMessage() {
  if (!imageScanComplete) return 'Hleð inn myndum...';

  return TOUCH_DEVICE
    ? 'Dragðu spaðann eða bankaðu til að byrja'
    : 'Smelltu á völlinn eða ýttu á bilstöng til að byrja';
}

function getServeMessage() {
  if (!imageScanComplete) return 'Hleð inn myndum...';

  return TOUCH_DEVICE
    ? 'Dragðu spaðann eða bankaðu til að gefa upp'
    : 'Smelltu eða ýttu á bilstöng til að gefa upp';
}

function getOverlayPrompt() {
  return TOUCH_DEVICE
    ? 'DRAGÐU SPAÐANN TIL AÐ SPILA'
    : 'SMELLTU EÐA ÝTTU Á BILSTÖNG';
}

function getCanvasPoint(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top) * (H / rect.height),
  };
}

function assignPointerSide(pointerId, x) {
  if (mode === 1) {
    pointerAssignments.set(pointerId, 'right');
    return 'right';
  }

  const side = x < W / 2 ? 'left' : 'right';
  pointerAssignments.set(pointerId, side);
  return side;
}

function movePaddleFromPoint(point, pointerId) {
  const side = pointerAssignments.get(pointerId) || assignPointerSide(pointerId, point.x);
  const targetY = clamp(point.y - PADDLE_H / 2, 0, H - PADDLE_H);

  if (mode === 1 || side === 'right') rightY = targetY;
  else leftY = targetY;
}

function handlePointerDown(e) {
  if (portraitBlocked) return;

  const point = getCanvasPoint(e.clientX, e.clientY);
  assignPointerSide(e.pointerId, point.x);
  movePaddleFromPoint(point, e.pointerId);
  startOrServe();
  if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
}

function handlePointerMove(e) {
  if (portraitBlocked) return;
  if (!pointerAssignments.has(e.pointerId)) return;

  movePaddleFromPoint(getCanvasPoint(e.clientX, e.clientY), e.pointerId);
}

function handlePointerEnd(e) {
  pointerAssignments.delete(e.pointerId);
  if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId) && canvas.releasePointerCapture) {
    canvas.releasePointerCapture(e.pointerId);
  }
}

function updateOrientationGate() {
  portraitBlocked = TOUCH_DEVICE && window.innerHeight > window.innerWidth;
  document.body.classList.toggle('rotate-lock', portraitBlocked);
  rotateOverlay.setAttribute('aria-hidden', portraitBlocked ? 'false' : 'true');
  updateUI();
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-1p').classList.toggle('active', m === 1);
  document.getElementById('btn-2p').classList.toggle('active', m === 2);
  resetGame();
  updateUI();
}

function serve() {
  serving = false;
  const angle = (Math.random() * 50 - 25) * Math.PI / 180;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const spd = 5.2;
  vx = dir * spd * Math.cos(angle);
  vy = spd * Math.sin(angle);
}

function getRandomBallIdx(currentIdx = -1) {
  if (friends.length <= 1) return 0;

  let nextIdx = currentIdx;
  while (nextIdx === currentIdx) {
    nextIdx = Math.floor(Math.random() * friends.length);
  }
  return nextIdx;
}

function resetGame() {
  scoreL = 0; scoreR = 0;
  serving = true; started = false;
  ballX = W/2; ballY = H/2;
  vx = 0; vy = 0;
  leftY = H/2 - PADDLE_H/2;
  rightY = H/2 - PADDLE_H/2;
  ballIdx = getRandomBallIdx();
}

function nextBall() {
  if (!friends.length) return;
  ballIdx = (ballIdx + 1) % friends.length;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function isRemoteUrl(url) {
  return /^https?:\/\//i.test(url);
}

function drawImageCover(img, x, y, size) {
  const srcW = img.naturalWidth || img.width;
  const srcH = img.naturalHeight || img.height;
  if (!srcW || !srcH) return;

  const srcSize = Math.min(srcW, srcH);
  const sx = (srcW - srcSize) / 2;
  const sy = (srcH - srcSize) / 2;

  ctx.drawImage(img, sx, sy, srcSize, srcSize, x, y, size, size);
}

function update() {
  if (portraitBlocked) return;

  // Left paddle — always mouse/keyboard based on mode
  if (mode === 1) {
    // 1P: player uses arrow keys for right paddle, AI controls left
    // AI tracks ball
    const mid = leftY + PADDLE_H / 2;
    if (mid < ballY - 4) leftY = clamp(leftY + AI_SPEED, 0, H - PADDLE_H);
    else if (mid > ballY + 4) leftY = clamp(leftY - AI_SPEED, 0, H - PADDLE_H);
  } else {
    // 2P: W/S for left paddle
    if (keys['w'] || keys['W']) leftY = clamp(leftY - 7.5, 0, H - PADDLE_H);
    if (keys['s'] || keys['S']) leftY = clamp(leftY + 7.5, 0, H - PADDLE_H);
  }

  // Right paddle — always arrow keys
  if (keys['ArrowUp'])   rightY = clamp(rightY - 7.5, 0, H - PADDLE_H);
  if (keys['ArrowDown']) rightY = clamp(rightY + 7.5, 0, H - PADDLE_H);

  if (serving) { ballX = W/2; ballY = H/2; return; }

  ballX += vx; ballY += vy;

  if (ballY - BALL_R < 0)  { ballY = BALL_R; vy = Math.abs(vy); }
  if (ballY + BALL_R > H)  { ballY = H - BALL_R; vy = -Math.abs(vy); }

  const lx = 20;
  const rx = W - 20 - PADDLE_W;

  // Left paddle collision
  if (vx < 0 && ballX - BALL_R < lx + PADDLE_W && ballX - BALL_R > lx - 4
      && ballY > leftY && ballY < leftY + PADDLE_H) {
    vx = Math.abs(vx) * 1.04;
    vy = ((ballY - (leftY + PADDLE_H/2)) / (PADDLE_H/2)) * 5;
    ballX = lx + PADDLE_W + BALL_R;
  }

  // Right paddle collision
  if (vx > 0 && ballX + BALL_R > rx && ballX + BALL_R < rx + PADDLE_W + 6
      && ballY > rightY && ballY < rightY + PADDLE_H) {
    vx = -Math.abs(vx) * 1.04;
    vy = ((ballY - (rightY + PADDLE_H/2)) / (PADDLE_H/2)) * 5;
    ballX = rx - BALL_R;
  }

  if (ballX - BALL_R < 0) { scoreR++; point(); }
  if (ballX + BALL_R > W) { scoreL++; point(); }
}

function point() {
  serving = true; vx = 0; vy = 0;
  nextBall();
  updateUI();
}

function drawField() {
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.setLineDash([6, 10]);
  ctx.strokeStyle = '#ffffff12';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.restore();
}

function drawPaddle(x, y, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, PADDLE_W, PADDLE_H, 4);
  else ctx.rect(x, y, PADDLE_W, PADDLE_H);
  ctx.fill();
  // glow
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBall() {
  const img = friendImgs[ballIdx];
  const f = friends[ballIdx] || { name: '?' };
  ctx.save();
  ctx.beginPath();
  ctx.arc(ballX, ballY, BALL_R, 0, Math.PI*2);
  ctx.clip();
  if (img && img.complete && img.naturalWidth > 0) {
    drawImageCover(img, ballX - BALL_R, ballY - BALL_R, BALL_R * 2);
  } else {
    ctx.fillStyle = '#1e1e38';
    ctx.fill();
    ctx.fillStyle = '#c8f050';
    ctx.font = 'bold 16px Space Mono, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((f.name || '?').slice(0,2).toUpperCase(), ballX, ballY);
  }
  ctx.restore();
  ctx.beginPath();
  ctx.arc(ballX, ballY, BALL_R, 0, Math.PI*2);
  ctx.strokeStyle = '#ffffff30';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawOverlay() {
  if (!imageScanComplete) {
    ctx.fillStyle = '#c8f05099';
    ctx.font = '14px Space Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HLEÐ INN MYNDUM...', W/2, H/2 + 72);
    return;
  }

  if (!started) {
    ctx.fillStyle = '#c8f05099';
    ctx.font = '14px Space Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(getOverlayPrompt(), W/2, H/2 + 72);
  } else if (serving) {
    ctx.fillStyle = '#c8f05066';
    ctx.font = '13px Space Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(getOverlayPrompt(), W/2, H - 22);
  }
}

function updatePhotoInfo() {
  const photoInfo = document.getElementById('photo-info');
  if (!photoInfo) return;

  if (!imageScanComplete) {
    photoInfo.textContent = 'Leita að myndum sem heita mynd-1.jpg, mynd-2.jpg, mynd-3.jpg og svo framvegis.';
    return;
  }

  if (!friends.length) {
    photoInfo.textContent = 'Engar myndir fundust. Settu skrár í möppuna sem heita mynd-1.jpg, mynd-2.jpg og svo framvegis.';
    return;
  }

  if (friends.length === 1) {
    photoInfo.textContent = 'Leikurinn fann eina mynd. Bættu við mynd-2.jpg til að fá fleiri bolta.';
    return;
  }

  photoInfo.textContent =
    `Leikurinn velur handahófskennda mynd af útskriftarnema í rafmagns- og tölvuverkfræði 2026 og skiptir síðan í röð í gegnum ${friends.length} myndir. Næsta mynd sem þú getur bætt við er mynd-${friends.length + 1}.jpg.`;
}

function updateUI() {
  document.getElementById('score-left').textContent = scoreL;
  document.getElementById('score-right').textContent = scoreR;
  const f = friends[ballIdx];
  document.getElementById('friend-label').textContent = imageScanComplete && f
    ? `Bolti: ${f.name || DEFAULT_BALL_NAME}`
    : imageScanComplete ? '—' : 'Hleð inn myndum...';

  if (!imageScanComplete) {
    document.getElementById('controls-hint').textContent =
      'Bíddu aðeins meðan leikurinn finnur myndirnar';
  } else if (portraitBlocked) {
    document.getElementById('controls-hint').textContent =
      'Snúðu símanum í lárétta stöðu til að halda áfram';
  } else if (TOUCH_DEVICE && mode === 1) {
    document.getElementById('controls-hint').textContent =
      'Dragðu fingrinum til að stýra hægri spaðanum';
  } else if (TOUCH_DEVICE) {
    document.getElementById('controls-hint').textContent =
      'Vinstri helmingur = vinstri spaði  ·  Hægri helmingur = hægri spaði';
  } else if (mode === 1) {
    document.getElementById('controls-hint').textContent =
      'Þú = hægri spaði (↑ ↓)  ·  Vinstri spaði = tölvan';
  } else {
    document.getElementById('controls-hint').textContent =
      'Vinstri = W / S  ·  Hægri = ↑ / ↓';
  }

  document.getElementById('msg').textContent = portraitBlocked
    ? 'Snúðu símanum á hlið til að spila'
    : !started ? getStartMessage()
    : serving ? getServeMessage() : '';

  updatePhotoInfo();
}

function loop() {
  update();
  drawField();
  drawPaddle(20, leftY, '#4f8ef7');
  drawPaddle(W - 20 - PADDLE_W, rightY, '#f74f4f');
  if (!serving || started) drawBall();
  drawOverlay();
  requestAnimationFrame(loop);
}

function loadImage(url) {
  return new Promise(resolve => {
    const img = new Image();
    if (isRemoteUrl(url)) img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function loadImages() {
  const detectedFriends = [];
  const detectedImgs = [];
  let misses = 0;

  for (let index = 1; index <= MAX_IMAGE_SCAN && misses < MAX_CONSECUTIVE_MISSES; index++) {
    const url = `${IMAGE_FILE_PREFIX}${index}${IMAGE_FILE_SUFFIX}`;
    const img = await loadImage(url);

    if (img && img.naturalWidth > 0) {
      misses = 0;
      detectedFriends.push({ name: `Mynd ${index}`, url });
      detectedImgs.push(img);
    } else {
      misses += 1;
    }
  }

  friends = detectedFriends;
  friendImgs = detectedImgs;
  imageScanComplete = true;
  resetGame();
  updateUI();
}

updateOrientationGate();
updateUI();
loadImages();
loop();
</script>
</body>
</html>
